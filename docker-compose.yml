services:
  grade-checker:
    build: .
    container_name: khu-grade-checker
    volumes:
      # 성적 기록 파일을 유지하기 위해 호스트와 공유 (폴더 마운트)
      - ./data:/app/data
    # .env 파일 로드
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Docker 내부에서는 무조건 헤드리스
      - HEADLESS=true
    # 컨테이너가 죽어도 자동 재가동 (단, 세션 쿠키는 휘발이라 재시작 시 재로그인 필요)
    restart: unless-stopped
    # 로그 크기 제한
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
